server:
  port: 8090

logging:
  file:
    name: ${LOGGING_FILE_NAME:./log/application.log}
  level:
    root: INFO
    com.checkout.payment.gateway: DEBUG

springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true

app:
  acquiring-bank:
    api: ${APP_ACQUIRING_BANK_API:http://localhost:8080/payments}
  payment:
    supported-currencies: ${APP_PAYMENT_SUPPORTED_CURRENCIES:USD,EUR,CAD}
