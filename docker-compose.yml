version: "3.8"

services:
  bank_simulator:
    container_name: bank_simulator
    image: bbyars/mountebank:2.8.1
    ports:
      - "2525:2525"
      - "8080:8080"
    command: --configfile /imposters/bank_simulator.ejs --allowInjection
    volumes:
      - type: bind
        source: ./imposters
        target: /imposters

  payment_gateway:
    container_name: payment_gateway
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8090:8090"
    environment:
      # Spring Boot server port
      - SERVER_PORT=8090

      # Map to ApplicationProperties:
      - APP_ACQUIRING_BANK_API=http://bank_simulator:8080/payments
      - APP_PAYMENT_SUPPORTED_CURRENCIES=USD,EUR,CAD
    depends_on:
      - bank_simulator